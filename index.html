    const formatDDMM = (dateObj) => {
      const dd = String(dateObj.getDate()).padStart(2, '0');
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      return `${dd}/${mm}`;
    };

    const formatDDMMYYYY = (dateObj) => {
      return `${formatDDMM(dateObj)}/${dateObj.getFullYear()}`;

    // Lấy Chủ nhật đầu tuần của một ngày bất kỳ (CN = 0 ... T7 = 6)
    const getSundayOfWeek = (dateObj) => {
      const d = new Date(dateObj);
      d.setHours(0, 0, 0, 0);
      const dayOfWeek = d.getDay(); // 0 = CN, 1 = T2 ... 6 = T7
      d.setDate(d.getDate() - dayOfWeek);
      return d;
    };

    // Tạo bộ 7 ngày (CN -> T7) từ một ngày Chủ nhật
    const buildWeekDaysFromSunday = (sundayDate) => {
      const days = {};
      const fullDays = {};
      DAYS_OF_WEEK.forEach((d, idx) => {
        const dt = new Date(sundayDate);
        dt.setDate(sundayDate.getDate() + idx);
        days[d.key] = formatDDMM(dt);
        fullDays[d.key] = formatDDMMYYYY(dt);
      });
      const satDate = new Date(sundayDate);
      satDate.setDate(sundayDate.getDate() + 6);
      return {
        days,
        fullDays,
        dateRange: `${formatDDMMYYYY(sundayDate)} - ${formatDDMMYYYY(satDate)}`,
      };
    };

    const computeDatesFromSundayInput = (sundayStr) => {
      if (!sundayStr || !sundayStr.trim()) return {};
      const parts = sundayStr.trim().split('/');
      if (parts.length < 2) return {};
      const d = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10) - 1;
      const y = parts[2] ? parseInt(parts[2], 10) : new Date().getFullYear();
      const base = new Date(y, m, d);
      if (isNaN(base.getTime())) return {};
      return buildWeekDaysFromSunday(base).days;
    };

    // Tính số điểm tối thiểu cần đạt ở bài Kiểm tra Cuối kỳ (HS3) để đạt mục tiêu ĐTB (8.0 Giỏi / 6.5 Khá / 5.0 Đạt)
    const predictRequiredFinalScore = (scoreObj, targetAvg) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;

      if (txValues.length === 0 && !hasGK) return null;

      const currentSum = txValues.reduce((a, b) => a + b, 0) + (hasGK ? gk * 2 : 0);
      const currentWeight = txValues.length + (hasGK ? 2 : 0);
      const totalWeightWithCK = currentWeight + 3;
      const requiredCK = (targetAvg * totalWeightWithCK - currentSum) / 3;
      return Number(requiredCK.toFixed(1));
    };

    const calculateSubjectAverage = (scoreObj) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const ck = parseFloat(scoreObj.ck);
      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;
      const hasCK = !isNaN(ck) && ck >= 0 && ck <= 10;

      if (txValues.length === 0 && !hasGK && !hasCK) return null;
      let totalScore = txValues.reduce((a, b) => a + b, 0);
      let totalWeight = txValues.length;
      if (hasGK) { totalScore += gk * 2; totalWeight += 2; }
      if (hasCK) { totalScore += ck * 3; totalWeight += 3; }
      if (totalWeight === 0) return null;
      return Number((totalScore / totalWeight).toFixed(1));
    };

            },
          },

      };
    };

    // ============================================================================
    // CƠ CHẾ LƯU TRỮ DỮ LIỆU
    // ============================================================================
    const STORAGE_KEY = 'gv_student_app_v8_complete';

    const loadSavedStateSync = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && parsed.archiveByYear) return parsed;
      } catch (e) {}
      return null;
    };

    function App() {
      const initialSaved = useMemo(() => loadSavedStateSync(), []);

      // ĐỒNG HỒ THỜI GIAN THỰC TRÊN MÁY (CẬP NHẬT TỪNG GIÂY)
      const [liveClock, setLiveClock] = useState(() => new Date());
      useEffect(() => {
        const timer = setInterval(() => setLiveClock(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const todayDDMM = formatDDMM(liveClock);
      const todayFullStr = formatDDMMYYYY(liveClock);
      const todayDayObj = DAYS_OF_WEEK[liveClock.getDay()]; // 0=CN -> 6=T7
      const currentMonthNum = liveClock.getMonth() + 1;

      // Trạng thái Đăng nhập Giáo viên
      const [isAuthenticated, setIsAuthenticated] = useState(
        () => sessionStorage.getItem('gv_portal_auth') === 'true'
      );
      const [teacherPin, setTeacherPin] = useState(
        () => initialSaved?.teacherPin || AUTH_CONFIG.defaultPin
      );
      const [loginAccountInput, setLoginAccountInput] = useState('');
      const [loginPinInput, setLoginPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [newPinSetting, setNewPinSetting] = useState('');

      const [schoolName, setSchoolName] = useState(
        () => initialSaved?.schoolName || 'Trường THPT & Trung Cấp Chuyên Nghiệp'
      );
      const [semester, setSemester] = useState(() => initialSaved?.semester || 'Học kỳ 1');
      const [teacherName, setTeacherName] = useState(
        () => initialSaved?.teacherName || AUTH_CONFIG.teacherName
      );
      const [mainSubject, setMainSubject] = useState(() => initialSaved?.mainSubject || 'Hóa học');
      const [schoolYear, setSchoolYear] = useState(() => initialSaved?.schoolYear || '2026 - 2027');
      const [archiveByYear, setArchiveByYear] = useState(
        () => initialSaved?.archiveByYear || buildDefaultArchive()
      );
      const [attendanceTypes, setAttendanceTypes] = useState(
        () => initialSaved?.attendanceTypes || INITIAL_ATTENDANCE_TYPES
      );
      const [seatLayoutConfig, setSeatLayoutConfig] = useState(
        () => initialSaved?.seatLayoutConfig || { cols: 4, desksPerCol: 5, seatsPerDesk: 2 }
      );

      const currentYearData = useMemo(() => {
        const years = Object.keys(archiveByYear);
        return archiveByYear[schoolYear] || archiveByYear[years[0]] || buildDefaultArchive()['2026 - 2027'];
      }, [archiveByYear, schoolYear]);

      const homeroomClassId = currentYearData.homeroomClassId || '';
      const classes = currentYearData.classes || [];
      const studentsByClass = currentYearData.studentsByClass || {};
      const classSubjects = currentYearData.classSubjects || {};
      const grades = currentYearData.grades || {};
      const attendance = currentYearData.attendance || {};
      const checklistsByClass = currentYearData.checklistsByClass || {};
      const weekMeta = currentYearData.weekMeta || {};
      const fundTransactionsByClass = currentYearData.fundTransactionsByClass || {};
      const lessonLogsByClass = currentYearData.lessonLogsByClass || {};
      const parentMessagesByClass = currentYearData.parentMessagesByClass || {};
      const leaveRequestsByClass = currentYearData.leaveRequestsByClass || {};
      const dutyRosterByClass = currentYearData.dutyRosterByClass || {};

      const [activeClass, setActiveClass] = useState(() => classes[0]?.id || '10A1');
      const [activeTab, setActiveTab] = useState('HOSO');
      const [selectedWeek, setSelectedWeek] = useState(1);
      const [selectedSubject, setSelectedSubject] = useState('Hóa học');
      const [searchQuery, setSearchQuery] = useState('');
      const [summaryPeriodMode, setSummaryPeriodMode] = useState('WHOLE_YEAR');

      const updateYearField = (field, updater) => {
        setArchiveByYear((prev) => {
          const curr = prev[schoolYear] || buildDefaultArchive()['2026 - 2027'];
          const nextVal = typeof updater === 'function' ? updater(curr[field]) : updater;
          return {
            ...prev,
            [schoolYear]: { ...curr, [field]: nextVal },
          };
        });
      };

      const setHomeroomClassId = (val) => updateYearField('homeroomClassId', val);
      const setClasses = (val) => updateYearField('classes', val);
      const setStudentsByClass = (val) => updateYearField('studentsByClass', val);
      const setClassSubjects = (val) => updateYearField('classSubjects', val);
      const setGrades = (val) => updateYearField('grades', val);
      const setAttendance = (val) => updateYearField('attendance', val);
      const setChecklistsByClass = (val) => updateYearField('checklistsByClass', val);
      const setWeekMeta = (val) => updateYearField('weekMeta', val);
      const setFundTransactionsByClass = (val) => updateYearField('fundTransactionsByClass', val);
      const setLessonLogsByClass = (val) => updateYearField('lessonLogsByClass', val);
      const setParentMessagesByClass = (val) => updateYearField('parentMessagesByClass', val);
      const setLeaveRequestsByClass = (val) => updateYearField('leaveRequestsByClass', val);
      const setDutyRosterByClass = (val) => updateYearField('dutyRosterByClass', val);

      // Đồng bộ tự động ngày tháng thực trên máy cho tuần đang chọn nếu tuần đó chưa có ngày
      const currentWeekInfo = useMemo(() => {
        if (weekMeta[selectedWeek] && weekMeta[selectedWeek].days) {
          return weekMeta[selectedWeek];
        }
        const liveWeek = buildWeekDaysFromSunday(getSundayOfWeek(new Date()));
        return {
          dateRange: liveWeek.dateRange,
          days: liveWeek.days,
        };
      }, [weekMeta, selectedWeek]);

      // Nút đồng bộ nhanh Tuần đang chọn về đúng Tuần Thực Tế Hôm Nay trên máy
      const handleSyncWeekToRealTimeToday = () => {
        const liveWeek = buildWeekDaysFromSunday(getSundayOfWeek(new Date()));
        setWeekMeta((prev) => ({
          ...(prev || {}),
          [selectedWeek]: {
            semester,
            dateRange: liveWeek.dateRange,
            days: liveWeek.days,
          },
        }));
        showToast(`Đã đồng bộ Tuần ${selectedWeek} khớp với lịch thực trên máy (${liveWeek.dateRange})!`);
      };

      const handleUpdateWeekDayDate = (dayKey, dateText) => {
        setWeekMeta((prev) => {
          const wObj = prev?.[selectedWeek] || { dateRange: currentWeekInfo.dateRange, days: { ...currentWeekInfo.days } };
          const nextDays = { ...(wObj.days || {}), [dayKey]: dateText };
          if (dayKey === 'CN' && dateText.includes('/')) {
            const autoDays = computeDatesFromSundayInput(dateText);
            if (Object.keys(autoDays).length === 7) {
              Object.assign(nextDays, autoDays);
            }
          }
          const rangeText =
            nextDays.CN && nextDays.T7 ? `${nextDays.CN} - ${nextDays.T7}` : wObj.dateRange;
          return {
            ...(prev || {}),
            [selectedWeek]: { ...wObj, dateRange: rangeText, days: nextDays },
          };
        });
      };

      const handleSwitchSemester = (targetSem) => {
        setSemester(targetSem);
        const semWeeks = SEMESTER_WEEKS[targetSem] || [1];
        if (!semWeeks.includes(selectedWeek)) {
          setSelectedWeek(semWeeks[0]);
        }
      };

      // Lưu tự động vào localStorage
      useEffect(() => {
        const payload = {
          schoolName, semester, teacherName, mainSubject, schoolYear, teacherPin,
          archiveByYear, attendanceTypes, seatLayoutConfig, updatedAt: Date.now(),
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
      }, [schoolName, semester, teacherName, mainSubject, schoolYear, teacherPin, archiveByYear, attendanceTypes, seatLayoutConfig]);

      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [newClassModalOpen, setNewClassModalOpen] = useState(false);
      const [newClassName, setNewClassName] = useState('');
      const [newSubjectName, setNewSubjectName] = useState('');
      const [studentModal, setStudentModal] = useState(null);
      const [excelImportModalOpen, setExcelImportModalOpen] = useState(false);
      const [excelPasteText, setExcelPasteText] = useState('');
      const [attendanceModal, setAttendanceModal] = useState(null);
      const [printReportTarget, setPrintReportTarget] = useState(null);
      const [printReportType, setPrintReportType] = useState('CONDUCT_WEEKLY');

      // Form Quỹ lớp (Thu / Chi)
      const [fundForm, setFundForm] = useState({ type: 'IN', title: '', amount: '', note: '' });

      // Form Sổ đầu bài tiết dạy
      const [lessonForm, setLessonForm] = useState({
        date: formatDDMMYYYY(new Date()),
        period: 'Tiết 1 - 2 (Sáng)',
        subject: 'Hóa học',
        lessonTitle: '',
        absentNames: 'Không có',
        classRating: 'Tốt (10/10)',
        teacherNote: '',
      });

      // Form Sổ liên lạc & Đơn xin phép PH
      const [selectedContactStuId, setSelectedContactStuId] = useState('');
      const [msgScenario, setMsgScenario] = useState('WEEKLY_REPORT');
      const [msgCustomText, setMsgCustomText] = useState('');
      const [leaveForm, setLeaveForm] = useState({ studentId: '', dayKey: 'T2', sessionKey: 'S', reason: '' });

      // Bộ lọc Biểu đồ Vi phạm & Chấm nhanh theo Tổ
      const [violationScope, setViolationScope] = useState('WEEK'); // 'WEEK' | 'YEAR'
      const [batchTeam, setBatchTeam] = useState(1);
      const [batchDay, setBatchDay] = useState(todayDayObj.key);
      const [batchSession, setBatchSession] = useState('S');
      const [batchCode, setBatchCode] = useState('PB');

      const [randomPickerOpen, setRandomPickerOpen] = useState(false);
      const [pickedStudent, setPickedStudent] = useState(null);

      const isHomeroomTeacher = activeClass === homeroomClassId;
      const currentClassObj = classes.find((c) => c.id === activeClass) || { id: activeClass, name: activeClass };
      const currentStudents = studentsByClass[activeClass] || [];
      const currentSubjects = classSubjects[activeClass] || [mainSubject];
      const currentChecklists = checklistsByClass[activeClass] || [];
      const currentFunds = fundTransactionsByClass[activeClass] || [];
      const currentLessons = lessonLogsByClass[activeClass] || [];
      const currentMessages = parentMessagesByClass[activeClass] || [];
      const currentLeaves = leaveRequestsByClass[activeClass] || [];
      const currentDuty = dutyRosterByClass[activeClass] || {};

      useEffect(() => {
        if (currentStudents.length > 0 && !currentStudents.some(s => s.id === selectedContactStuId)) {
          setSelectedContactStuId(currentStudents[0].id);
        }
      }, [activeClass, currentStudents]);

      const filteredStudents = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return currentStudents;
        return currentStudents.filter(
          (s) =>
            s.name.toLowerCase().includes(q) ||
            (s.moetId || s.id || '').toLowerCase().includes(q) ||
            (s.vocational || '').toLowerCase().includes(q) ||
            (s.tuitionStatus || '').toLowerCase().includes(q)
        );
      }, [currentStudents, searchQuery]);

      // ============================================================================
      // TÍNH TOÁN CHUYÊN CẦN, THI ĐUA 4 TỔ & BIỂU ĐỒ VI PHẠM
      // ============================================================================
      const getStudentWeekRecord = (stuId, weekNum = selectedWeek) => {
        return attendance[activeClass]?.[weekNum]?.[stuId] || {};
      };

      const getStudentDaySessionCodes = (stuId, dayKey, sessionKey = 'S', weekNum = selectedWeek) => {
        const rec = getStudentWeekRecord(stuId, weekNum);
        const sessionField = `${dayKey}_${sessionKey}`;
        if (Array.isArray(rec[sessionField])) return rec[sessionField];
        if (sessionKey === 'S' && Array.isArray(rec[dayKey])) return rec[dayKey];
        return [];
      };

      const calculateWeeklyConductScore = (stuId, weekNum = selectedWeek) => {
        let score = 100;
        let totalAbsentP = 0, totalAbsentK = 0, totalLate = 0, totalPlus = 0, violationCount = 0;

        DAYS_OF_WEEK.forEach((d) => {
          SESSIONS_OF_DAY.forEach((ses) => {
            const codes = getStudentDaySessionCodes(stuId, d.key, ses.key, weekNum);
            codes.forEach((code) => {
              const typeObj = attendanceTypes.find((t) => t.id === code);
              if (typeObj) {
                score += Number(typeObj.points || 0);
                if (typeObj.points < 0) violationCount += 1;
                if (code === 'P') totalAbsentP += 1;
                if (code === 'K') totalAbsentK += 1;
                if (code === 'M') totalLate += 1;
                if (typeObj.points > 0) totalPlus += 1;
              }
            });
          });
        });

        const clamped = Math.max(0, Math.min(120, score));
        let rank = 'Tốt';
        if (clamped < 65 || totalAbsentK >= 2) rank = 'Chưa đạt';
        else if (clamped < 80) rank = 'Đạt';
        else if (clamped < 90) rank = 'Khá';

        return { score: clamped, rank, totalAbsentP, totalAbsentK, totalLate, totalPlus, violationCount };
      };

      const calculateYearAttendanceSummary = (stuId) => {
        const classAtt = attendance[activeClass] || {};
        let absentP = 0, absentK = 0, late = 0, plusCount = 0, totalScoreSum = 0, trackedWeeks = 0, totalViolations = 0;

        Object.keys(classAtt).forEach((wKey) => {
          const wSummary = calculateWeeklyConductScore(stuId, Number(wKey));
          absentP += wSummary.totalAbsentP;
          absentK += wSummary.totalAbsentK;
          late += wSummary.totalLate;
          plusCount += wSummary.totalPlus;
          totalViolations += wSummary.violationCount;
          totalScoreSum += wSummary.score;
          trackedWeeks += 1;
        });

        const avgConductScore = trackedWeeks > 0 ? Math.round(totalScoreSum / trackedWeeks) : 100;
        let yearConductRank = 'Tốt';
        if (avgConductScore < 65 || absentK >= 5) yearConductRank = 'Chưa đạt';
        else if (avgConductScore < 80) yearConductRank = 'Đạt';
        else if (avgConductScore < 90) yearConductRank = 'Khá';

        return { absentP, absentK, late, plusCount, avgConductScore, yearConductRank, totalViolations };
      };

      // TÍNH TOÁN BẢNG XẾP HẠNG THI ĐUA 4 TỔ TỰ ĐỘNG
      const teamCompetitionRanking = useMemo(() => {
        return [1, 2, 3, 4]
          .map((teamNum) => {
            const members = currentStudents.filter((s) => Number(s.team || 1) === teamNum);
            if (members.length === 0) {
              return { teamNum, memberCount: 0, avgConduct: 100, plusTotal: 0, violationTotal: 0, totalPoints: 100 };
            }
            let sumConduct = 0, plusTotal = 0, violationTotal = 0;
            members.forEach((m) => {
              const w = calculateWeeklyConductScore(m.id, selectedWeek);
              sumConduct += w.score;
              plusTotal += w.totalPlus;
              violationTotal += w.violationCount;
            });
            const avgConduct = Number((sumConduct / members.length).toFixed(1));
            return {
              teamNum,
              memberCount: members.length,
              avgConduct,
              plusTotal,
              violationTotal,
              totalPoints: avgConduct,
            };
          })
          .sort((a, b) => b.totalPoints - a.totalPoints);
      }, [currentStudents, attendance, selectedWeek, activeClass]);

      // DỮ LIỆU BIỂU ĐỒ HỌC SINH VI PHẠM NHIỀU
      const violationChartData = useMemo(() => {
        const list = currentStudents.map((stu) => {
          if (violationScope === 'WEEK') {
            const w = calculateWeeklyConductScore(stu.id, selectedWeek);
            return {
              ...stu,
              count: w.violationCount,
              score: w.score,
              detail: `Vắng ${w.totalAbsentP}P/${w.totalAbsentK}K • Muộn ${w.totalLate}`,
            };
          } else {
            const y = calculateYearAttendanceSummary(stu.id);
            return {
              ...stu,
              count: y.totalViolations,
              score: y.avgConductScore,
              detail: `Lũy kế năm: Vắng ${y.absentP}P/${y.absentK}K • Muộn ${y.late}`,
            };
          }
        });
        return list.filter((x) => x.count > 0 || x.score < 95).sort((a, b) => b.count - a.count || a.score - b.score);
      }, [currentStudents, attendance, selectedWeek, violationScope, activeClass]);

      // Mật độ vi phạm theo 7 ngày trong tuần (CN -> T7)
      const dayDensityStats = useMemo(() => {
        return DAYS_OF_WEEK.map((d) => {
          let errCount = 0;
          currentStudents.forEach((stu) => {
            SESSIONS_OF_DAY.forEach((ses) => {
              const codes = getStudentDaySessionCodes(stu.id, d.key, ses.key, selectedWeek);
              codes.forEach((c) => {
                const t = attendanceTypes.find((x) => x.id === c);
                if (t && t.points < 0) errCount += 1;
              });
            });
          });
          return { ...d, errCount };
        });
      }, [currentStudents, attendance, selectedWeek, activeClass]);

      // ============================================================================
      // TÍNH TOÁN ĐIỂM SỐ & HỌC BỔNG / MIỄN GIẢM HỌC PHÍ
      // ============================================================================
      const getStudentSubjectScoreObj = (stuId, subj = selectedSubject, sem = semester) => {
        return grades[activeClass]?.[sem]?.[subj]?.[stuId] || { tx1: '', tx2: '', tx3: '', tx4: '', gk: '', ck: '', comment: '' };
      };

      const getSubjectWholeYearAvg = (stuId, subj) => {
        const hk1 = calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, 'Học kỳ 1'));
        const hk2 = calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, 'Học kỳ 2'));
        if (hk1 !== null && hk2 !== null) return Number(((hk1 + hk2 * 2) / 3).toFixed(1));
        if (hk1 !== null) return hk1;
        if (hk2 !== null) return hk2;
        return null;
      };

      const getStudentOverallGPA = (stuId, mode = summaryPeriodMode) => {
        const validScores = currentSubjects
          .map((subj) =>
            mode === 'WHOLE_YEAR'
              ? getSubjectWholeYearAvg(stuId, subj)
              : calculateSubjectAverage(getStudentSubjectScoreObj(stuId, subj, semester))
          )
          .filter((v) => v !== null);
        if (validScores.length === 0) return null;
        return Number((validScores.reduce((a, b) => a + b, 0) / validScores.length).toFixed(1));
      };

      const getHonorTitle = (gpa, conductRank) => {
        if (gpa === null) return 'Chưa xét';
        if (gpa >= 9.0 && conductRank === 'Tốt') return 'Học sinh Xuất sắc';
        if (gpa >= 8.0 && conductRank === 'Tốt') return 'Học sinh Giỏi';
        if (gpa >= 6.5 && (conductRank === 'Tốt' || conductRank === 'Khá')) return 'Học sinh Tiên tiến';
        return 'Hoàn thành';
      };

      // ============================================================================
      // THAO TÁC NGHIỆP VỤ
      // ============================================================================
      const handleTeacherLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const acc = loginAccountInput.trim().toLowerCase();
        const pin = loginPinInput.trim();
        if ((AUTH_CONFIG.allowedAccounts.includes(acc) || acc === teacherName.toLowerCase()) && pin === teacherPin) {
          setIsAuthenticated(true);
          sessionStorage.setItem('gv_portal_auth', 'true');
          setLoginPinInput('');
          showToast(`Xin chào Thầy ${teacherName}.`);
        } else {
          setLoginError('Tài khoản Email hoặc Mã đăng nhập Giáo viên không chính xác.');
        }
      };

      const handleUpdateStudentFieldInline = (stuId, field, value) => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) => (s.id === stuId ? { ...s, [field]: value } : s)),
        }));
      };

      const toggleAttendanceCode = (stuId, dayKey, codeId, sessionKey = 'S') => {
        setAttendance((prev) => {
          const classAtt = prev[activeClass] || {};
          const weekAtt = classAtt[selectedWeek] || {};
          const stuAtt = { ...(weekAtt[stuId] || {}) };
          const sessionField = `${dayKey}_${sessionKey}`;
          let currentCodes = Array.isArray(stuAtt[sessionField]) ? stuAtt[sessionField] : [];
          const exists = currentCodes.includes(codeId);
          stuAtt[sessionField] = exists ? currentCodes.filter((c) => c !== codeId) : [...currentCodes, codeId];
          return {
            ...prev,
            [activeClass]: { ...classAtt, [selectedWeek]: { ...weekAtt, [stuId]: stuAtt } },
          };
        });
      };

      // Chấm chuyên cần / Cộng điểm nhanh hàng loạt theo Tổ
      const handleBatchTeamAttendance = () => {
        const teamMembers = currentStudents.filter((s) => Number(s.team || 1) === Number(batchTeam));
        if (teamMembers.length === 0) {
          showToast(`Tổ ${batchTeam} hiện chưa có thành viên nào.`);
          return;
        }
        teamMembers.forEach((stu) => {
          const curCodes = getStudentDaySessionCodes(stu.id, batchDay, batchSession, selectedWeek);
          if (!curCodes.includes(batchCode)) {
            toggleAttendanceCode(stu.id, batchDay, batchCode, batchSession);
          }
        });
        showToast(`Đã ghi nhận mã [${batchCode}] cho toàn bộ ${teamMembers.length} HS Tổ ${batchTeam}!`);
      };

      const handleGradeChange = (stuId, field, value) => {
        setGrades((prev) => {
          const classGrades = prev[activeClass] || {};
          const semGrades = classGrades[semester] || {};
          const subjGrades = semGrades[selectedSubject] || {};
          const stuGrades = subjGrades[stuId] || { tx1: '', tx2: '', tx3: '', tx4: '', gk: '', ck: '', comment: '' };
          return {
            ...prev,
            [activeClass]: {
              ...classGrades,
              [semester]: {
                ...semGrades,
                [selectedSubject]: { ...subjGrades, [stuId]: { ...stuGrades, [field]: value } },
              },
            },
          };
        });
      };

      // Tạo tin nhắn Zalo tự động cho Phụ huynh
      const buildParentZaloTemplate = (stu, scenario) => {
        if (!stu) return '';
        const wCond = calculateWeeklyConductScore(stu.id, selectedWeek);
        const yCond = calculateYearAttendanceSummary(stu.id);
        const gpa = getStudentOverallGPA(stu.id, summaryPeriodMode);
        const wDate = currentWeekInfo.dateRange ? ` (${currentWeekInfo.dateRange})` : '';

        if (scenario === 'VIOLATION_ALERT') {
          return `Kính gửi Phụ huynh em ${stu.name} (${currentClassObj.name}): Trong Tuần ${selectedWeek}${wDate}, em có ${wCond.violationCount} lượt vi phạm/đi muộn/vắng (Điểm rèn luyện tuần: ${wCond.score}/100đ). Rất mong gia đình phối hợp cùng GVCN nhắc nhở em khắc phục. Trân trọng, GV ${teacherName}.`;
        }
        if (scenario === 'PRAISE_HONOR') {
          return `Kính gửi Phụ huynh em ${stu.name} (${currentClassObj.name}): GVCN xin biểu dương em đã có thành tích học tập và rèn luyện xuất sắc trong Tuần ${selectedWeek}${wDate} (Điểm chuyên cần: ${wCond.score}đ, ĐTB: ${gpa ?? '--'}). Mong gia đình tiếp tục khích lệ em! Trân trọng, GV ${teacherName}.`;
        }
        if (scenario === 'TUITION_REMINDER') {
          return `Kính gửi Phụ huynh em ${stu.name} (${currentClassObj.name}): Hồ sơ chế độ miễn/giảm học phí nghề của em hiện ở trạng thái "${stu.tuitionStatus || 'Đang cập nhật'}". Kính đề nghị Phụ huynh hoàn thiện giấy tờ nộp về văn phòng lớp đúng hạn. Trân trọng, GV ${teacherName}.`;
        }
        return `Kính gửi Phụ huynh em ${stu.name} (${currentClassObj.name}): Báo cáo Tuần ${selectedWeek}${wDate} (${semester}) — Chuyên cần: ${wCond.score}/100đ (${wCond.rank}, lũy kế vắng ${yCond.absentP}P/${yCond.absentK}K); ĐTB các môn: ${gpa ?? '--'}. Nhận xét: ${stu.gvcnComment || 'Học tập nghiêm túc.'} Trân trọng, GV ${teacherName}.`;
      };

      const handleCopyAndOpenZalo = (stu, customText = null) => {
        const text = customText || buildParentZaloTemplate(stu, msgScenario);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        }
        const logEntry = {
          id: 'MSG' + Date.now(),
          date: `${todayFullStr} ${liveClock.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}`,
          studentName: stu.name,
          parentPhone: stu.parentPhone || 'Chưa có SĐT',
          content: text,
        };
        setParentMessagesByClass((prev) => ({
          ...prev,
          [activeClass]: [logEntry, ...(prev[activeClass] || [])],
        }));
        const cleanPhone = (stu.parentPhone || '').replace(/\D/g, '');
        if (cleanPhone) {
          window.open(`https://zalo.me/${cleanPhone}`, '_blank');
        }
        showToast(`Đã copy tin nhắn & lưu nhật ký liên hệ Phụ huynh em ${stu.name}!`);
      };

      const triggerPrintPDF = (target, type = 'CONDUCT_WEEKLY') => {
        setPrintReportTarget(target);
        setPrintReportType(type);
        setTimeout(() => window.print(), 250);
      };

      const studentsToPrint = useMemo(() => {
        if (!printReportTarget || printReportTarget === 'ALL' || printReportTarget === 'SEATING_CHART') {
          return currentStudents;
        }
        return [printReportTarget];
      }, [printReportTarget, currentStudents]);

      // Tính tổng Thu / Chi / Tồn Quỹ lớp
      const fundSummary = useMemo(() => {
        let totalIn = 0, totalOut = 0;
        currentFunds.forEach((f) => {
          if (f.type === 'IN') totalIn += Number(f.amount || 0);
          else totalOut += Number(f.amount || 0);
        });
        return { totalIn, totalOut, balance: totalIn - totalOut };
      }, [currentFunds]);

      // Danh sách học sinh sinh nhật trong tháng hiện tại trên máy
      const birthdayStudentsThisMonth = useMemo(() => {
        return currentStudents.filter((s) => {
          if (!s.dob || !s.dob.includes('/')) return false;
          const m = parseInt(s.dob.split('/')[1], 10);
          return m === currentMonthNum;
        });
      }, [currentStudents, currentMonthNum]);

      // ==========================================================================
      // MÀN HÌNH ĐĂNG NHẬP GIÁO VIÊN
      // ==========================================================================
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-[#F7F6F2] text-[#1B3B48] flex flex-col justify-between">
            <header className="bg-[#1B3B48] text-[#F7F6F2] py-4 px-6 border-b border-[#5C7667]/40">
              <div className="max-w-5xl mx-auto flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-[#5C7667] flex items-center justify-center font-extrabold text-sm text-white">
                    SỔ GV
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-bold text-white">{teacherName}</h1>
                    <p className="text-xs text-[#D8E2DC]">{AUTH_CONFIG.subNote} • Sổ Quản Lý Học Sinh</p>
                  </div>
                </div>
                <div className="text-xs text-[#E9C46A] font-mono font-bold">
                  🕒 {liveClock.toLocaleTimeString('vi-VN')} • {todayDayObj.label}, {todayFullStr}
                </div>
              </div>
            </header>

            <main className="flex-1 flex items-center justify-center p-4 sm:p-6">
              <div className="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-12 bg-white rounded-3xl border border-[#E2DFD7] shadow-lg overflow-hidden">
                <div className="lg:col-span-6 p-8 bg-[#EFECE6] flex flex-col justify-between space-y-6">
                  <div className="space-y-4">
                    <span className="inline-block px-3 py-1 rounded-full bg-[#1B3B48] text-white text-xs font-bold uppercase">
                      Cổng Quản Trị Lớp Học
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-[#1B3B48] leading-snug">
                      Quản lý Toàn diện,
                      <br />
                      Đồng bộ Thời gian thực.
                    </h2>
                    <p className="text-xs sm:text-sm text-[#4A5A62] leading-relaxed">
                      Tích hợp Thi đua 4 Tổ, Sổ thu chi quỹ lớp, Dự báo điểm cuối kỳ, Hồ sơ miễn giảm học phí nghề, Sổ đầu bài tiết dạy và In Giấy biểu dương PDF A4.
                    </p>
                  </div>
                  <div className="text-xs text-[#5C7667] border-t border-[#DFDBD0] pt-4">
                    Lịch thực trên máy: <strong className="text-[#1B3B48]">{todayDayObj.label}, ngày {todayFullStr}</strong>
                  </div>
                </div>

                <div className="lg:col-span-6 p-8 bg-[#1B3B48] text-[#F7F6F2] flex flex-col justify-center space-y-5">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-widest text-[#E9C46A]">Xác thực Giáo viên</span>
                    <h3 className="text-2xl font-bold text-white mt-1">Đăng nhập Hệ thống</h3>
                  </div>
                  <form onSubmit={handleTeacherLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold mb-1 text-gray-200">Email Giáo viên</label>
                      <input
                        type="text"
                        required
                        value={loginAccountInput}
                        onChange={(e) => setLoginAccountInput(e.target.value)}
                        placeholder="anhduonganhtuan@gmail.com"
                        className="w-full px-4 py-3 rounded-xl bg-white text-[#1B3B48] text-sm font-medium focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1 text-gray-200">Mã đăng nhập (Mặc định: 123456)</label>
                      <input
                        type="password"
                        required
                        value={loginPinInput}
                        onChange={(e) => setLoginPinInput(e.target.value)}
                        placeholder="••••••"
                        className="w-full px-4 py-3 rounded-xl bg-white text-[#1B3B48] text-sm font-medium focus:outline-none"
                      />
                    </div>
                    {loginError && (
                      <div className="p-3 rounded-xl bg-red-500/20 border border-red-400/40 text-red-100 text-xs">{loginError}</div>
                    )}
                    <button
                      type="submit"
                      className="w-full bg-[#5C7667] hover:bg-[#4A6154] text-white font-bold py-3 rounded-xl text-sm flex items-center justify-center gap-2"
                    >
                      <Lock className="w-4 h-4" />
                      <span>Mở khóa Sổ Quản Lý</span>
                    </button>
                  </form>
                </div>
              </div>
            </main>
          </div>
        );
      }

      // ==========================================================================
      // GIAO DIỆN CHÍNH SAU KHI ĐĂNG NHẬP
      // ==========================================================================
      return (
        <div className="min-h-screen bg-[#F7F6F2] text-[#1B3B48] flex flex-col md:flex-row font-sans">
          {toastMsg && (
            <div className="fixed bottom-4 right-4 z-50 bg-[#1B3B48] text-white px-4 py-3 rounded-xl border border-[#5C7667] shadow-lg text-xs font-medium flex items-center gap-2 no-print">
              <Check className="w-4 h-4 text-[#E9C46A] shrink-0" />
              <span>{toastMsg}</span>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className="w-full md:w-64 bg-white border-b md:border-b-0 md:border-r border-[#E2DFD7] flex flex-col justify-between shrink-0 no-print">
            <div>
              <div className="p-4 bg-[#1B3B48] text-[#F7F6F2]">
                <div className="text-[11px] font-semibold text-[#E9C46A] truncate">{schoolName}</div>
                <div className="flex items-center justify-between mt-1">
                  <span className="text-sm font-extrabold text-white">Sổ Quản Lý Học Sinh</span>
                  <span className="px-2 py-0.5 text-[11px] font-bold bg-white/15 text-white rounded">{schoolYear}</span>
                </div>

                {/* Đồng hồ & Lịch thực trên máy */}
                <div className="mt-2.5 p-2 rounded-xl bg-black/25 text-[11px] flex items-center justify-between">
                  <span className="text-[#E9C46A] font-bold">{todayDayObj.label}, {todayFullStr}</span>
                  <span className="font-mono font-bold text-white">{liveClock.toLocaleTimeString('vi-VN')}</span>
                </div>

                {/* Chọn Học kỳ 1 / Học kỳ 2 */}
                <div className="grid grid-cols-2 gap-1 mt-2.5 bg-black/25 p-1 rounded-xl text-xs">
                  {['Học kỳ 1', 'Học kỳ 2'].map((sem) => (
                    <button
                      key={sem}
                      onClick={() => handleSwitchSemester(sem)}
                      className={`py-1.5 rounded-lg font-bold transition ${
                        semester === sem ? 'bg-[#E9C46A] text-[#1B3B48]' : 'text-gray-200 hover:text-white'
                      }`}
                    >
                      {sem}
                    </button>
                  ))}
                </div>
              </div>

              {/* 1. GVCN */}
              <div className="p-3 border-b border-[#EFECE6]">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-xs font-bold text-[#1B3B48]">1. Công tác Chủ nhiệm (GVCN)</span>
                </div>
                {homeroomClassId && (
                  <button
                    onClick={() => setActiveClass(homeroomClassId)}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold border ${
                      activeClass === homeroomClassId
                        ? 'bg-[#2C4A3E] text-white border-[#2C4A3E]'
                        : 'bg-[#FAF9F6] text-[#1B3B48] border-[#E2DFD7]'
                    }`}
                  >
                    <span className="flex items-center gap-1.5">
                      <Award className="w-4 h-4 text-[#E9C46A]" />
                      Lớp {homeroomClassId} (CN)
                    </span>
                    <span className="text-[11px] px-1.5 py-0.5 rounded bg-black/15">
                      {(studentsByClass[homeroomClassId] || []).length} HS
                    </span>
                  </button>
                )}
              </div>

              {/* 2. GVBM */}
              <div className="p-3 border-b border-[#EFECE6]">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-bold text-[#1B3B48]">2. Lớp Bộ môn ({mainSubject})</span>
                  <button
                    onClick={() => setNewClassModalOpen(true)}
                    className="text-[11px] font-bold text-[#2C4A3E] px-2 py-0.5 rounded-lg bg-[#EFECE6]"
                  >
                    + Thêm
                  </button>
                </div>
                <div className="space-y-1 max-h-40 overflow-y-auto">
                  {classes.map((cls) => (
                    <button
                      key={cls.id}
                      onClick={() => setActiveClass(cls.id)}
                      className={`w-full flex items-center justify-between px-2.5 py-1.5 rounded-xl text-xs font-semibold border ${
                        activeClass === cls.id
                          ? 'bg-[#1B3B48] text-white border-[#1B3B48]'
                          : 'bg-white text-[#1B3B48] border-[#E2DFD7]'
                      }`}
                    >
                      <span>{cls.name}</span>
                      <span className="text-[11px] opacity-80">{(studentsByClass[cls.id] || []).length} HS</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* CÀI ĐẶT GV */}
            <div className="p-3 border-t border-[#E2DFD7] bg-[#FAF9F6] space-y-2">
              {!isEditingProfile ? (
                <div className="flex items-center justify-between">
                  <div className="min-w-0">
                    <div className="text-xs font-bold text-[#1B3B48] truncate">{teacherName}</div>
                    <div className="text-[11px] text-[#5C7667]">{AUTH_CONFIG.subNote} • {mainSubject}</div>
                  </div>
                  <div className="flex items-center gap-1">
                    <button
                      onClick={() => setIsEditingProfile(true)}
                      className="p-1.5 border border-[#E2DFD7] rounded-lg bg-white"
                      title="Cài đặt GV"
                    >
                      <Settings className="w-3.5 h-3.5" />
                    </button>
                    <button
                      onClick={handleLogout}
                      className="p-1.5 text-red-700 border border-red-200 rounded-lg bg-red-50"
                      title="Đăng xuất"
                    >
                      <LogOut className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>
              ) : (
                <div className="p-2.5 bg-white border rounded-xl space-y-2 text-xs">
                  <input type="text" value={teacherName} onChange={(e) => setTeacherName(e.target.value)} className="w-full px-2 py-1 border rounded" />
                  <input type="text" value={schoolName} onChange={(e) => setSchoolName(e.target.value)} className="w-full px-2 py-1 border rounded" />
                  <input type="password" value={newPinSetting} onChange={(e) => setNewPinSetting(e.target.value)} placeholder="Đổi mã PIN mới..." className="w-full px-2 py-1 border rounded" />
                  <button
                    onClick={() => {
                      if (newPinSetting.trim()) { setTeacherPin(newPinSetting.trim()); setNewPinSetting(''); }
                      setIsEditingProfile(false);
                      showToast('Đã lưu cài đặt.');
                    }}
                    className="w-full bg-[#1B3B48] text-white rounded-lg py-1.5 font-bold"
                  >
                    Lưu cài đặt
                  </button>
                </div>
              )}
            </div>
          </aside>

          {/* VÙNG LÀM VIỆC CHÍNH */}
          <main className="flex-1 flex flex-col min-w-0 no-print">
            {/* TOP HEADER */}
            <header className="bg-white border-b border-[#E2DFD7] px-6 py-3.5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
              <div>
                <div className="flex flex-wrap items-center gap-2">
                  <h1 className="text-xl font-extrabold text-[#1B3B48]">{currentClassObj.name}</h1>
                  <span className="px-2.5 py-0.5 text-xs font-bold rounded-full bg-[#2C4A3E] text-white">
                    {isHomeroomTeacher ? 'GVCN & Bộ môn' : `GVBM (${mainSubject})`}
                  </span>
                  <span className="text-xs text-[#5C7667] font-semibold">
                    • {currentStudents.length} HS • {semester} • Hôm nay: <strong className="text-[#1B3B48]">{todayDayObj.label}, {todayFullStr}</strong>
                  </span>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={handleSyncWeekToRealTimeToday}
                  className="px-3 py-1.5 bg-[#EDF3EF] hover:bg-[#DCE8E0] text-[#2C4A3E] border border-[#C3D8CB] rounded-xl text-xs font-bold flex items-center gap-1"
                  title="Đồng bộ Tuần đang chọn với ngày thực tế trên máy"
                >
                  <Clock className="w-3.5 h-3.5" />
                  Đồng bộ Tuần thực tế
                </button>
                <button
                  onClick={exportClassCSV}
                  className="px-3 py-1.5 bg-[#EFECE6] hover:bg-[#E2DFD7] text-[#1B3B48] rounded-xl text-xs font-bold flex items-center gap-1"
                >
                  <Download className="w-3.5 h-3.5" />
                  Xuất Excel
                </button>
              </div>
            </header>

            {/* THANH 8 PHÂN HỆ CHỨC NĂNG TOÀN DIỆN */}
            <div className="bg-[#EFECE6]/70 border-b border-[#E2DFD7] px-4 sm:px-6 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-2">
              <nav className="flex flex-wrap gap-1 pt-2 xl:pt-0">
                {[
                  { id: 'HOSO', label: '1. Hồ sơ & Miễn giảm HP', icon: Users },
                  { id: 'CHUYENCAN', label: '2. Chuyên cần (CN→T7)', icon: Calendar },
                  { id: 'SODIEM', label: '3. Sổ điểm & Dự báo CK', icon: BookOpen },
                  { id: 'THUNOP', label: '4. Bài tập & Sổ Quỹ lớp', icon: Wallet },
                  { id: 'SODO', label: '5. Sơ đồ Bàn học', icon: LayoutGrid },
                  { id: 'TONGKET', label: '6. Tổng kết & Khen thưởng', icon: FileText },
                  { id: 'SO_LIEN_LAC', label: '7. Sổ Liên Lạc & Xin Phép PH', icon: MessageCircle },
                  { id: 'THI_DUA_SO_DAU_BAI', label: '8. Thi đua 4 Tổ, Biểu đồ & Sổ Đầu Bài', icon: Trophy },
                ].map((tab) => {
                  const Icon = tab.icon;
                  const active = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center gap-1.5 px-3 py-2.5 text-xs font-bold border-b-2 transition-colors ${
                        active
                          ? 'border-[#1B3B48] text-[#1B3B48] bg-white rounded-t-xl'
                          : 'border-transparent text-[#5C7667] hover:text-[#1B3B48]'
                      }`}
                    >
                      <Icon className="w-3.5 h-3.5" />
                      <span>{tab.label}</span>
                    </button>
                  );
                })}
              </nav>

              <div className="relative py-1.5">
                <Search className="w-3.5 h-3.5 text-[#5C7667] absolute left-2.5 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  placeholder="Tìm tên HS, mã Bộ, chế độ HP..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="pl-8 pr-3 py-1.5 text-xs bg-white border border-[#E2DFD7] rounded-xl w-full sm:w-56 focus:outline-none focus:border-[#1B3B48]"
                />
              </div>
            </div>

            {/* NỘI DUNG TỪNG TAB */}
            <div className="p-6 flex-1 overflow-auto">
              {/* ===================================================================
                  TAB 1: HỒ SƠ HỌC SINH, HỌC NGHỀ, MIỄN GIẢM HỌC PHÍ & THẺ LƯU Ý ĐẶC BIỆT

      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
